name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ausdruecklich nur lesen, statt sich auf die Repo-Voreinstellung zu verlassen:
# Die steht heute auf "read", aber ein Workflow soll nicht davon abhaengen, was
# jemand irgendwann in den Einstellungen umstellt.
permissions:
  contents: read

# Actions stehen auf einem Commit-SHA, nicht auf einem Tag. Ein Tag laesst sich
# verschieben - wer die Action uebernimmt, liefe damit in diesem Workflow mit.
# Die Version dahinter ist nur der Kommentar; Dependabot haelt beides aktuell
# (.github/dependabot.yml).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: composer

      - run: composer install --prefer-dist --no-progress

      - run: composer lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: composer

      - run: composer install --prefer-dist --no-progress

      - run: composer test

  # Statische Analyse, Stufe 5 mit Baseline (phpstan.neon.dist). Neue Befunde
  # brechen den Lauf ab; die Baseline soll nur schrumpfen.
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: composer

      - run: composer install --prefer-dist --no-progress

      - run: composer analyse

  # Baut die Bloecke so, wie es der Release-Workflow tut (release.yml: dieselbe
  # Node-Version, npm ci aus der Lockdatei). Ohne diesen Job lief der Build nur
  # beim Release - ein Dependabot-PR fuer @wordpress/scripts war gruen, ohne
  # dass je gebaut wurde.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      - name: Build-Ergebnis pruefen
        run: |
          for block in event-list group-list; do
            test -s "blocks/${block}/build/index.js"
            test -s "blocks/${block}/build/index.asset.php"
          done

  # Gegen ein echtes WordPress mit SQLite (tests-integration/): Speichern ueber
  # die Settings-API, Verschluesselung, Migration, Sperre, Weiterleitungen,
  # Deinstallation. Die Installation entsteht bei jedem Lauf frisch.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, sqlite3
          tools: composer

      - run: composer install --prefer-dist --no-progress

      # WP-CLI als feste Release-Version mit Pruefsumme statt ueber setup-php
      # (tools: wp-cli). Das holte den jeweils neuesten Nightly-Build von
      # github.com/wp-cli/builds; am 2026-10-02 antwortete die Adresse mit 503,
      # setup-php meldete nur "Could not setup wp-cli" und lief weiter, und der
      # Job scheiterte erst im naechsten Schritt an "wp: command not found".
      # Version und Summe gehoeren zusammen - beim Anheben beide aendern (die
      # Summe steht im Release als wp-cli-<version>.phar.sha256).
      - name: WP-CLI laden
        env:
          WP_CLI_VERSION: '2.12.0'
          WP_CLI_SHA256: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/wp-cli.phar" \
            "https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}/wp-cli-${WP_CLI_VERSION}.phar"
          echo "${WP_CLI_SHA256}  ${RUNNER_TEMP}/wp-cli.phar" | sha256sum --check --strict

      - run: bin/integration-setup.sh "${RUNNER_TEMP}/wordpress"
        env:
          WP_CLI: php ${{ runner.temp }}/wp-cli.phar

      - run: composer test:integration
        env:
          CTP_WP_DIR: ${{ runner.temp }}/wordpress


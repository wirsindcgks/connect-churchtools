name: Release

# Triggered by a version tag (see plan.md's "Changelog"-Konvention: bump the Version
# header, tag vX.Y.Z). Neither `vendor/` (Composer) nor `blocks/*/build/`
# (the Gutenberg block's compiled editor script) are committed to the repo — a plain
# GitHub source checkout/zip is missing both and won't actually run. This workflow
# builds both, packages a clean plugin directory, and attaches it as a release asset
# so GitHubUpdateChecker (see includes/Update/GitHubUpdateChecker.php) has something
# installable to point admins at.
#
# Zwei Jobs statt einem (Sicherheits-Review 2026-09-14): Das ZIP installiert sich
# auf fremden Seiten selbst, und Composer, npm und setup-php laufen mit fremdem
# Code. Der Build bekommt deshalb nur Leserechte; Schreibrecht auf das Repo und
# das Recht, die Herkunft zu bescheinigen, hat allein der zweite Job, und der
# fuehrt keinen Code aus Abhaengigkeiten aus. Die Actions stehen auf Commit-SHAs
# (Begruendung in ci.yml), und veroeffentlicht wird mit dem vorinstallierten
# `gh` statt mit einer Drittanbieter-Action, die dafuer Schreibrecht braeuchte.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # update.json ist die Datei, aus der installierte Kopien von einer neuen
      # Version erfahren (siehe includes/Update/GitHubUpdateChecker.php). Sie
      # liegt im Repo, wird mit bin/make-update-json.php erzeugt und zeigt auf
      # ein Paket, das es erst nach diesem Lauf gibt. Bleibt sie beim Taggen
      # auf der vorigen Version stehen, laeuft das Release durch und trotzdem
      # bekommt niemand das Update angeboten - deshalb hier abbrechen, wie beim
      # fehlenden Changelog-Abschnitt weiter unten.
      - name: Check update.json points at this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="https://github.com/wirsindcgks/connect-churchtools/releases/download/v${version}/churchtools-plugin-v${version}.zip"
          if ! jq -e --arg v "$version" --arg u "$expected" \
            '.version == $v and .download_url == $u' update.json > /dev/null; then
            echo "::error::update.json does not point at ${GITHUB_REF_NAME} (run: php bin/make-update-json.php .)"
            exit 1
          fi

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: composer

      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # v7 statt v4: Die aelteren Majors laufen auf der Node-20-Laufzeit der
      # Actions, die GitHub inzwischen zwangsweise auf Node 24 hebt und bei jedem
      # Release-Lauf anmahnt. package-manager-cache ist aus, weil v5 automatisches
      # Dependency-Caching eingefuehrt hat - dieser Workflow baut ein Artefakt, das
      # sich auf fremden Seiten selbst installiert, also bleibt der Build so
      # nachvollziehbar wie bisher: npm ci aus der Lockdatei, nichts dazwischen.
      # Node 24 ist der aktive LTS-Strang (Wartung ab Oktober 2026, Ende 2028) und
      # dieselbe Laufzeit, auf der GitHub die Actions selbst inzwischen ausfuehrt.
      # Vorher stand hier 20 - seit dem 30.04.2026 ohne Sicherheitsupdates. Fest
      # gepinnt statt lts/*, weil aus diesem Schritt ein Artefakt faellt, das sich
      # auf fremden Seiten installiert: Welche Node-Version es gebaut hat, soll in
      # der Datei stehen und nicht davon abhaengen, wann der Lauf startet.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      # Stage a clean copy under a churchtools-plugin/ top-level directory (the
      # plugin slug) rather than zipping the checkout in place — WP identifies an
      # installed plugin by its folder name, and the update package must match it.
      # Staged outside the checkout (runner.temp) so rsync's source tree never
      # overlaps its own destination.
      - name: Stage plugin files
        run: |
          mkdir -p "${RUNNER_TEMP}/churchtools-plugin"
          rsync -a --exclude-from=.github/release-excludes.txt ./ "${RUNNER_TEMP}/churchtools-plugin/"

      - name: Create zip
        run: |
          mkdir -p "${RUNNER_TEMP}/dist"
          cd "${RUNNER_TEMP}"
          zip -r "${RUNNER_TEMP}/dist/churchtools-plugin-${GITHUB_REF_NAME}.zip" churchtools-plugin

      # Die Release-Seite trug bisher nur einen Link auf den Commit-Bereich. Der
      # CHANGELOG-Abschnitt dieses Tags sagt, was sich tatsaechlich geaendert hat,
      # und zwar in denselben Worten, die auch der Tab „Updates" im Backend zeigt -
      # also wird er die Release-Notes. GitHub haengt seine automatisch erzeugten
      # Notizen samt „Full Changelog"-Zeile darunter.
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/dist/release-notes.md"
          # Ein leerer Abschnitt heisst: Der Tag wurde ohne seinen CHANGELOG-Eintrag
          # gesetzt. Hier abzubrechen ist Absicht - lieber ein gestopptes Release als
          # ein veroeffentlichtes, dessen Seite nichts sagt.
          if [ ! -s "${RUNNER_TEMP}/dist/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      # Signierter Herkunftsnachweis (Sigstore) fuer das ZIP: Er bescheinigt,
      # dass genau diese Datei aus diesem Workflow an diesem Commit stammt.
      # Pruefen laesst er sich mit
      #   gh attestation verify churchtools-plugin-vX.Y.Z.zip -R wirsindcgks/connect-churchtools
      # Er verhindert kein boeswilliges Release, macht aber ein untergeschobenes
      # ZIP (nicht aus diesem Workflow) erkennbar.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/churchtools-plugin-${{ github.ref_name }}.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/churchtools-plugin-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md \
            --generate-notes
